# Example Gauge configuration.
#
# This configuration runs the smoke suite with the deterministic fake adapter,
# which writes a candidate implementation instead of calling a model. It
# exercises the full lifecycle: fixture workspace, agent execution, diff
# capture, independent evaluation, and reporting.
#
#   gauge run --config examples/gauge.toml --suite smoke --agent fake

data_dir = "./.gauge-data"
tasks_dir = "../tasks"
suites_dir = "../suites"

[retention]
# keep_failed (default), keep_all, or delete_all
workspace = "keep_failed"

[defaults]
repetitions = 1

[adapters.fake]
enabled = true

[adapters.fake.options]
mode = "write"
agent_version = "fake-1.0.0"
model = "fake/deterministic"
provider = "fake"

[adapters.fake.options.usage]
input_tokens = 420
output_tokens = 96
total_tokens = 516

[adapters.fake.options.files]
"greeting_all.go" = '''package greeting

// GreetAll returns one greeting per name, in order.
func GreetAll(names []string) []string {
	out := make([]string, 0, len(names))
	for _, name := range names {
		out = append(out, Greet(name))
	}
	return out
}
'''

# Iris adapter (optional). Uncomment to run the same suites against Iris:
#
#   gauge run --config examples/gauge.toml --suite smoke --agent iris
#
# Gauge gives each attempt a fresh Iris home, so nothing from ~/.iris applies.
# settings_file is copied into that home and is how the model, context window,
# and [security.shell] policy are configured. Adapter paths such as this one
# resolve against the working directory, so run commands from the repository
# root. A run's --model flag wins.
#
# [adapters.iris]
# enabled = true
#
# [adapters.iris.options]
# command = "iris"
# model = "qwen3.6-35B-Q1"
# base_url = "http://127.0.0.1:8080/v1"
# settings_file = "examples/iris-settings.toml"

# Pi adapter (optional). Uncomment to run the same suites against Pi:
#
#   gauge run --config examples/gauge.toml --suite smoke --agent pi
#
# Gauge gives each attempt a fresh Pi agent directory, so nothing from ~/.pi
# applies. models_file is copied into it and is how a custom endpoint and model
# are configured (Pi has no --base-url flag). Adapter paths resolve against the
# working directory, so run commands from the repository root. A run's --model
# flag wins over model.
#
# [adapters.pi]
# enabled = true
#
# [adapters.pi.options]
# command = "pi"
# provider = "gauge-local"
# model = "qwen3.6-35B-Q1"
# thinking = "off"
# models_file = "examples/pi-models.json"
# forward_env = ["OPENAI_API_KEY"]
